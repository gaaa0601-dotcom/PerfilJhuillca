<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TU NOMBRE | Perfil</title>
<meta name="description" content="Mis redes y mi CV en un solo lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6f0f0;
    --bg2: #cfe4e6;
    --net: rgba(31,111,120,.30);
    --node: #1f6f78;
    --surface: #ffffff;
    --text: #14262b;
    --muted: #5a6b70;
    --line: #d3dcdb;
    --accent: #1f6f78;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1417;
      --bg2: #12303a;
      --net: rgba(79,179,189,.28);
      --node: #4fb3bd;
      --surface: #172629;
      --text: #e8f0ef;
      --muted: #94a8ac;
      --line: #2a3d41;
      --accent: #4fb3bd;
      --accent-text: #0f1b1e;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 70%) fixed;
    color: var(--text);
    position: relative;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  main { width: 100%; max-width: 440px; position: relative; z-index: 1; }
  .red { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .red svg { width: 100%; height: 100%; }
  .red line { stroke: var(--net); stroke-width: 1.2; }
  .red circle { fill: var(--node); }
  .red .n { opacity: .5; }
  .red .pulso { animation: pulso 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .red .p2 { animation-delay: .8s; } .red .p3 { animation-delay: 1.6s; } .red .p4 { animation-delay: 2.4s; }
  @keyframes pulso { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.8); } }
  .carrera {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 8px 14px;
    border: 1px solid var(--accent); border-radius: 999px;
    font-size: .85rem; font-weight: 500; color: var(--text);
    background: var(--surface);
  }
  .carrera svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .perfil { text-align: center; margin-bottom: 32px; }
  .foto {
    width: 112px; height: 112px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    background: var(--line);
    margin-bottom: 16px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 2rem;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .rol { color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .enlaces { list-style: none; padding: 0; display: grid; gap: 12px; }
  .enlaces a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .15s, transform .15s;
  }
  .enlaces a:hover { border-color: var(--accent); transform: translateY(-2px); }
  .enlaces a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .enlaces svg { width: 24px; height: 24px; flex: none; fill: var(--accent); }
  .enlaces .cv { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .enlaces .cv svg { fill: var(--accent-text); }
  footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) {
    .red .pulso { animation: none; opacity: .8; }
    .enlaces a { transition: none; }
    .enlaces a:hover { transform: none; }
  }
</style>
</head>
<body>
